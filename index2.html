<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Pixel Assembly Simulator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1c;
            font-family: sans-serif;
            overflow-x: hidden;
            color: #fff;
        }

        /* Creates structural room to allow page scrolling */
        .scroll-space {
            height: 350vh; 
            position: relative;
        }

        /* Centers and locks the animation window during scroll tracking */
        .canvas-holder {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90vw;
            max-width: 450px;
            pointer-events: none;
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .scroll-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: pulseText 2.5s infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.9; }
        }
    </style>
</head>
<body>

        <div class="canvas-holder">
            <canvas id="displaceCanvas"></canvas>
        </div>
        <div class="scroll-hint">Scroll down slowly to resolve text</div>
    </div>

        imageSource.onload = function() {
            // Set canvas structure proportional to the text layout dimensions
            canvas.width = imageSource.width;
            canvas.height = imageSource.height;
            canvasW = imageSource.width;
            canvasH = imageSource.height;

            // Extract baseline pixel configurations
            ctx.drawImage(imageSource, 0, 0);
            
            // Map out coordinates to split layout into distinct particle pieces
            for (let y = 0; y < canvasH; y += blockSize) {
                for (let x = 0; x < canvasW; x += blockSize) {
                    
                    // Creates an expansive random scattering offset field across coordinates
                    const offscreenX = (Math.random() - 0.5) * canvasW * 3.5 + canvasW / 2;
                    const offscreenY = (Math.random() - 0.5) * canvasH * 3.5 + canvasH / 2;

                    pixelCluster.push({
                        destinationX: x,       
                        destinationY: y,       
                        originX: offscreenX,  
                        originY: offscreenY,  
                        trackX: offscreenX,
                        trackY: offscreenY
                    });
                }
            }

            // Fire loop calculations
            renderFrame();
        };

        function renderFrame() {
            // Translate page scrolling depth into progress values ranging from 0.0 to 1.0
            const currentScroll = window.scrollY;
            const totalScrollableArea = document.documentElement.scrollHeight - window.innerHeight;
            const timelineFactor = Math.min(currentScroll / totalScrollableArea, 1);

            // Wipe drawing canvas clean before recalculating new placements
            ctx.clearRect(0, 0, canvasW, canvasH);

            // Adjust positions and redraw individual layout squares
            pixelCluster.forEach(block => {
                // Smooth linear path interpolation between scattered states and final targets
                block.trackX = block.originX + (block.destinationX - block.originX) * timelineFactor;
                block.trackY = block.originY + (block.destinationY - block.originY) * timelineFactor;

                // Crop corresponding visual chunk from image array and render on map coordinates
                ctx.drawImage(
                    imageSource, 
                    block.destinationX, block.destinationY, blockSize, blockSize, 
                    block.trackX, block.trackY, blockSize, blockSize 
                );
            });

            // Re-render frame configurations continuously
            requestAnimationFrame(renderFrame);
        }
    </script>
